[workspace]
resolver = "2"
members = [
  "crates/perfetto-everywhere",
  "crates/perfetto-everywhere-core",
  "crates/perfetto-everywhere-native",
  "crates/perfetto-everywhere-web",
  "crates/perfetto-everywhere-collector",
  "crates/perfetto-everywhere-tracing",
  "examples/native-capture",
  "tests/browser/ordinary-producer",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SanderVocke/perfetto-everywhere"
homepage = "https://github.com/SanderVocke/perfetto-everywhere"
keywords = ["perfetto", "tracing", "wasm", "audio-worklet"]
categories = ["development-tools::debugging", "wasm"]

[workspace.dependencies]
perfetto-everywhere-core = { version = "0.1.0", path = "crates/perfetto-everywhere-core" }
perfetto-everywhere-native = { version = "0.1.0", path = "crates/perfetto-everywhere-native" }
perfetto-everywhere-web = { version = "0.1.0", path = "crates/perfetto-everywhere-web" }
perfetto-everywhere-collector = { version = "0.1.0", path = "crates/perfetto-everywhere-collector" }
perfetto-everywhere-tracing = { version = "0.1.0", path = "crates/perfetto-everywhere-tracing" }
