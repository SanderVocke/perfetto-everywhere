name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust components
        run: rustup component add rustfmt clippy
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Unit tests
        run: cargo test --workspace --all-features
      - name: Documentation
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --workspace --all-features --no-deps
      - name: Validate package contents
        run: |
          for manifest in crates/*/Cargo.toml; do
            cargo package --manifest-path "$manifest" --list >/dev/null
          done

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Native release build
        run: cargo build --release --workspace

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install WASM target
        run: rustup target add wasm32-unknown-unknown
      - name: WASM build
        run: >-
          cargo build --release --target wasm32-unknown-unknown
          -p perfetto-everywhere
          -p perfetto-everywhere-core
          -p perfetto-everywhere-web
          -p perfetto-everywhere-collector
          -p perfetto-everywhere-tracing
