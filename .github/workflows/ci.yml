name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Install Rust components and protobuf compiler
        run: |
          rustup component add rustfmt clippy
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Unit tests
        run: cargo test --workspace --all-features
      - name: Facade feature powerset
        run: |
          cargo check -p perfetto-everywhere
          cargo check -p perfetto-everywhere --features disabled
          cargo check -p perfetto-everywhere --features tracing
          cargo check -p perfetto-everywhere --features disabled,tracing
      - name: Documentation
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --workspace --all-features --no-deps
      - name: Package and verify publishable workspace crates
        run: scripts/package-workspace.sh

  collector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Collector unit and clock-snapshot acceptance
        run: |
          cargo test -p perfetto-everywhere-collector
          scripts/validate-collector.sh artifacts

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Install MSRV, WASM target, and protobuf compiler
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup target add --toolchain 1.85.0 wasm32-unknown-unknown
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: MSRV native tests
        run: cargo +1.85.0 test --workspace --all-features
      - name: MSRV WASM check
        run: >-
          cargo +1.85.0 check --target wasm32-unknown-unknown
          -p perfetto-everywhere
          -p perfetto-everywhere-core
          -p perfetto-everywhere-web
          -p perfetto-everywhere-collector
          -p perfetto-everywhere-tracing

  security-and-licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: License metadata policy
        run: scripts/check-licenses.py
      - name: RustSec audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Native release build and disabled contract
        run: |
          cargo build --release --workspace
          cargo check -p perfetto-everywhere --features disabled --examples
      - name: Native capture and Trace Processor acceptance
        run: |
          scripts/run-native-example.sh artifacts
          scripts/validate-native.sh
      - name: tracing compatibility acceptance
        run: scripts/validate-tracing.sh artifacts
      - name: Native overhead sanity check
        env:
          ITERATIONS: "10000"
          REPETITIONS: "1"
        run: scripts/benchmark-native.sh artifacts

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Install WASM target, bindgen CLI, and protobuf compiler
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.121 --locked
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Ordinary page and Worker browser acceptance
        run: scripts/run-ordinary-browser.sh artifacts
      - name: Short AudioWorklet acceptance
        env:
          AUDIO_DURATION_MS: "3000"
        run: |
          scripts/run-audio-browser.sh artifacts
          scripts/validate-audio.sh artifacts
      - name: Complete multirealm browser acceptance
        run: |
          scripts/run-browser-multirealm.sh artifacts
          scripts/validate-browser-multirealm.sh artifacts
          scripts/capture-browser-ui.sh artifacts/browser-ui.png
      - name: Upload browser acceptance artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-acceptance-${{ github.sha }}
          path: |
            artifacts/ordinary-browser.json
            artifacts/audio-transport.json
            artifacts/audio-transport.pftrace
            artifacts/audio-query.txt
            artifacts/browser-multirealm.json
            artifacts/browser-multirealm.pftrace
            artifacts/browser-multirealm-query.txt
            artifacts/browser-ui.png
          if-no-files-found: error
          retention-days: 14

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Install WASM target and protobuf compiler
        run: |
          rustup target add wasm32-unknown-unknown
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: WASM build
        run: >-
          cargo build --release --target wasm32-unknown-unknown
          -p perfetto-everywhere
          -p perfetto-everywhere-core
          -p perfetto-everywhere-web
          -p perfetto-everywhere-collector
          -p perfetto-everywhere-tracing
      - name: WASM facade feature powerset
        run: |
          cargo check --target wasm32-unknown-unknown -p perfetto-everywhere --features disabled --examples
          cargo check --target wasm32-unknown-unknown -p perfetto-everywhere --features tracing
          cargo check --target wasm32-unknown-unknown -p perfetto-everywhere --features disabled,tracing
