name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust components and protobuf compiler
        run: |
          rustup component add rustfmt clippy
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Unit tests
        run: cargo test --workspace --all-features
      - name: Documentation
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --workspace --all-features --no-deps
      - name: Validate package contents
        run: |
          for manifest in crates/*/Cargo.toml; do
            cargo package --manifest-path "$manifest" --list >/dev/null
          done

  collector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Collector unit and clock-snapshot acceptance
        run: |
          cargo test -p perfetto-everywhere-collector
          scripts/validate-collector.sh artifacts

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Native release build and disabled contract
        run: |
          cargo build --release --workspace
          cargo check -p perfetto-everywhere --features disabled --examples
      - name: Native capture and Trace Processor acceptance
        run: |
          scripts/run-native-example.sh artifacts
          scripts/validate-native.sh
      - name: Native overhead sanity check
        env:
          ITERATIONS: "10000"
          REPETITIONS: "1"
        run: scripts/benchmark-native.sh artifacts

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install WASM target and matching bindgen CLI
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.121 --locked
      - name: Ordinary page and Worker browser acceptance
        run: scripts/run-ordinary-browser.sh artifacts

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install WASM target and protobuf compiler
        run: |
          rustup target add wasm32-unknown-unknown
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: WASM build
        run: >-
          cargo build --release --target wasm32-unknown-unknown
          -p perfetto-everywhere
          -p perfetto-everywhere-core
          -p perfetto-everywhere-web
          -p perfetto-everywhere-collector
          -p perfetto-everywhere-tracing
      - name: WASM disabled API contract
        run: >-
          cargo check --target wasm32-unknown-unknown
          -p perfetto-everywhere --features disabled --examples
